<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reps">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#0E1515" media="(prefers-color-scheme: dark)">

<style>
/* layout: one phone-width column of cards, fixed tab bar at the bottom */
:root{
  --bg:#EDF1F2;--card:#FFFFFF;--ink:#12201F;--muted:#5B6968;--line:#D3DCDB;
  --accent:#0F6E6E;--accent-ink:#FFFFFF;--soft:#D7ECEA;--gold:#C98A12;--warn:#B5412B;--warn-soft:#F8E5DF;
  color-scheme:light;--r:18px;--display:"Space Grotesk",system-ui,sans-serif;--body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1515;--card:#172020;--ink:#ECF1F0;--muted:#94A3A1;--line:#283534;
  --accent:#5FD0C5;--accent-ink:#06201E;--soft:#143432;--gold:#E8B84A;--warn:#F08A72;--warn-soft:#3A1E18;color-scheme:dark
}}
:root[data-theme="dark"]{
  --bg:#0E1515;--card:#172020;--ink:#ECF1F0;--muted:#94A3A1;--line:#283534;
  --accent:#5FD0C5;--accent-ink:#06201E;--soft:#143432;--gold:#E8B84A;--warn:#F08A72;--warn-soft:#3A1E18;color-scheme:dark
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
h1,h2,.clock,.ring b,.stats b{font-family:var(--display)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden}
#app{max-width:480px;margin:0 auto;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
h1{font-size:40px;line-height:1;font-weight:800;letter-spacing:-.03em}
h1 span{font-size:18px;color:var(--muted);font-weight:600;letter-spacing:0}
h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:26px 0 10px}
h2:first-child{margin-top:6px}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px}
.hero{display:flex;gap:16px;align-items:center;margin:4px 0 16px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px;margin-bottom:10px}
.banner.ok{background:var(--soft);color:var(--accent)}
.habit{display:flex;gap:14px;align-items:flex-start}
.habit .hb{flex:1;min-width:0}
.chk{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--line);flex:none;display:grid;place-items:center;transition:.15s}
.chk svg{width:22px;height:22px;stroke:var(--accent-ink);stroke-width:3;fill:none;opacity:0;transform:scale(.5);transition:.15s}
.habit.done .chk{background:var(--accent);border-color:var(--accent)}
.habit.done .chk svg{opacity:1;transform:none}
.habit.done h3{color:var(--accent)}
.sub{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;width:0;transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{padding:9px 14px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-weight:650;font-size:14px;min-height:40px}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.ghost{color:var(--muted)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:750;font-size:16px;text-align:center}
.btn:active{transform:scale(.985)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:none;color:var(--warn);border:1px solid var(--warn)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);min-height:46px;outline:none;display:block;min-width:0;max-width:100%;margin:0;font-size:16px}
/* iOS draws date fields at their own intrinsic width and centres the value; make them behave like the other fields */
input[type=date]{-webkit-appearance:none;appearance:none;height:46px;line-height:20px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=number]{-moz-appearance:textfield}
select{-webkit-appearance:none;appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;text-overflow:ellipsis}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:92px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:10px 0 5px}
.grat input{margin-top:6px}
details summary{cursor:pointer;font-weight:650;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"＋";float:right;color:var(--muted)}
details[open] summary::after{content:"－"}
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:center;z-index:5}
#tabs div{display:flex;width:100%;max-width:480px}
#tabs button{flex:1;padding:6px 0;font-size:11px;font-weight:650;color:var(--muted);display:grid;gap:2px;justify-items:center}
#tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--accent)}
.ex{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border:0}
.ex .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);width:92px;flex:none}
.ex .nm{flex:1;font-weight:650;min-width:0}
.ex select{flex:1;min-width:0;min-height:40px;padding:8px 34px 8px 10px;font-weight:650}
.ex .g{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ex a{color:var(--muted);font-size:13px;text-decoration:none;padding:6px}
.ex .mini{width:62px;flex:none;padding:8px 6px;text-align:center;min-height:42px}
.ex .icon{width:34px;height:34px;font-size:14px}
.ex{gap:8px}
.icon{width:38px;height:38px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;flex:none;font-size:16px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lvl{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;margin-top:8px;font-weight:650;font-size:14px}
.clock{font-size:76px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.04em;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.grid button{aspect-ratio:1;border-radius:50%;font-size:11px;font-weight:700;border:1.5px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.grid .part{background:var(--soft);border-color:var(--soft);color:var(--accent)}
.grid .full{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid .miss{border-style:dashed;border-color:var(--warn);color:var(--warn)}
.grid .ms{box-shadow:0 0 0 2px var(--gold)}
.grid .now{outline:2.5px solid var(--ink);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stats div{padding:12px 4px}
.stats b[style]{font-size:16px!important;white-space:nowrap}
.stats b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted);font-weight:600}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;font-weight:550}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.cols{columns:2;column-gap:14px}.cols .check{break-inside:avoid;padding:5px 0;font-size:14px}
.verdict{font-weight:750;margin-top:10px}
.decl{white-space:pre-wrap;font-size:15px;line-height:1.6;background:var(--bg);border-radius:12px;padding:14px;margin:10px 0}
.step{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:800;margin-right:8px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
#sheet .in{background:var(--card);width:100%;max-width:480px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:650;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.link{color:var(--accent);font-weight:650;text-decoration:underline;text-underline-offset:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2>*{min-width:0}
.card{min-width:0;overflow-wrap:anywhere}
ul.tips{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
ul.tips li{margin:3px 0}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pic{aspect-ratio:3/4;border-radius:12px;overflow:hidden;position:relative;background:var(--bg);border:1px dashed var(--line);display:grid;place-items:center;font-size:13px;font-weight:650;color:var(--muted);cursor:pointer;width:100%}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pic.has{border-style:solid}
.pic.has span{position:absolute;left:6px;bottom:6px;background:var(--ink);color:var(--bg);padding:2px 8px;border-radius:99px;font-size:11px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
</style>
</head>
<body>
<div id="app"><main id="view"></main></div>
<nav id="tabs" hidden><div></div></nav>
<div id="sheet" hidden><div class="in"></div></div>
<div id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>dk(new Date());
const addDays=(k,n)=>{const d=pd(k);d.setDate(d.getDate()+n);return dk(d)};
const diff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const nf=(n,d=1)=>Number(n).toLocaleString('nb-NO',{maximumFractionDigits:d});
const fmtDate=k=>pd(k).toLocaleDateString('nb-NO',{weekday:'long',day:'numeric',month:'short'});
const pick=a=>a[Math.floor(Math.random()*a.length)];
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}

/* ---------- state ---------- */
const KEY='reps100.v1';
const DEF={onboarded:false,name:'',start:today(),
  targets:{protein:150,kcalMin:1900,kcalMax:2200,water:3.8},
  profile:{sex:'m',age:35,height:180,weight:80,target:80,act:1.375,goal:'cut'},
  days:{},levels:{arms:1,legs:1,abs:1,back:1},gear:{bar:false,kb:false,band:false,vest:false},plan:null,
  weights:[],baseline:{},photos:{},grocery:{},exlog:{},pics:{},gone:{},epoch:0,hideInstall:false,
  goals:{w1:'',w2:'',wisdom:'',stature:'',faith:'',people:'',heard:{},memo:false}};
let S=load();
const norm=s=>({...structuredClone(DEF),...s,targets:{...DEF.targets,...s.targets},profile:{...DEF.profile,...s.profile},goals:{...DEF.goals,...s.goals},levels:{...DEF.levels,...s.levels},gear:{...DEF.gear,...s.gear}});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s)return norm(s)}catch(e){}return structuredClone(DEF)}
function save(){S.u=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Kunne ikke lagre – lagringen på enheten er full.')}queueSync()}

/* ---------- account + sync (Supabase) ----------
   State is one row per user (merged per day, newest wins); photos and the voice memo are files in a private bucket.
   The app keeps working from the device copy when signed out or offline. */
const SB_URL='https://jvctmdyiytzbxycrlbjn.supabase.co',SB_KEY='sb_publishable_NsFJNte1jJdUhXE62HPlpA_fLXe5jum'; // publishable key: safe to ship, access is limited by row level security
let hasGoogle=false;
let sb=null,sess=null,syncAt=0,syncBusy=false,syncAgain=false,syncMsg='',syncT=0;
const typing=()=>!!document.activeElement?.matches('input,textarea,select');
const MK='reps100.sync';
const marks=()=>{try{return{up:{},lv:{},...JSON.parse(localStorage.getItem(MK))}}catch(e){return{up:{},lv:{}}}};
const setMarks=m=>{try{localStorage.setItem(MK,JSON.stringify(m))}catch(e){}};
const holdBlob=(k,v)=>{const m=marks();m.lv[k]=v;setMarks(m)};
const canon=v=>Array.isArray(v)?'['+v.map(canon).join(',')+']':v&&typeof v==='object'?'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}':JSON.stringify(v??null);
function mergeState(a,b){
  if((a.epoch||0)!==(b.epoch||0))return structuredClone((a.epoch||0)>(b.epoch||0)?a:b);
  const top=!a.onboarded&&b.onboarded?b:b.onboarded&&!a.onboarded?b:(a.u||0)>=(b.u||0)?a:b,o=structuredClone(top);
  o.days={};
  for(const k of new Set([...Object.keys(a.days||{}),...Object.keys(b.days||{})])){const x=a.days?.[k],y=b.days?.[k];o.days[k]=structuredClone(!y?x:!x?y:(x.u||0)>=(y.u||0)?x:y)}
  o.gone={};for(const src of[a.gone||{},b.gone||{}])for(const k in src)o.gone[k]=Math.max(o.gone[k]||0,src[k]);
  const pics={};for(const src of[a.pics||{},b.pics||{}])for(const k in src)pics[k]=Math.max(pics[k]||0,src[k]);
  o.pics={};for(const k in pics)if(pics[k]>(o.gone[k]||0))o.pics[k]=pics[k];
  o.u=Math.max(a.u||0,b.u||0);return o;
}
const spath=k=>sess.user.id+'/'+k.replace(/[^A-Za-z0-9._-]/g,'_');
const syncText=()=>!sb?'Synk mellom enheter er ikke satt opp. Alt lagres på denne enheten.':!sess?'Ikke innlogget. Alt lagres bare på denne enheten.':syncBusy?'Synker …':syncMsg?syncMsg:syncAt?`Sist synket kl. ${new Date(syncAt).toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit'})}.`:'Ikke synket ennå.';
function paintSync(){const e=$('#syncst');if(e)e.textContent=syncText()}
function queueSync(){if(!sb||!sess)return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(),2500)}
async function syncBlobs(){
  const m=marks(),want={...S.pics};if(S.goals.memo)want.memo=S.goals.memoU||1;let changed=false;
  const bucket=sb.storage.from('reps');
  for(const k in want){
    const local=await idbGet(k).catch(()=>null),mine=local&&(m.lv[k]===want[k]||(m.lv[k]==null&&want[k]<=1));
    if(mine){if(m.up[k]!==want[k]){const{error}=await bucket.upload(spath(k),local,{upsert:true,contentType:local.type||'application/octet-stream'});if(!error){m.up[k]=want[k];setMarks(m)}}}
    else{const{data,error}=await bucket.download(spath(k));if(data&&!error){await idbSet(k,data);m.lv[k]=m.up[k]=want[k];setMarks(m);if(picUrl[k]){URL.revokeObjectURL(picUrl[k]);delete picUrl[k]}changed=true}}
  }
  for(const k in S.gone||{})if(!S.pics[k]&&m.up['x:'+k]!==S.gone[k]){
    await idbDel(k).catch(()=>{});await bucket.remove([spath(k)]);
    m.up['x:'+k]=S.gone[k];delete m.up[k];delete m.lv[k];setMarks(m);if(picUrl[k]){URL.revokeObjectURL(picUrl[k]);delete picUrl[k]}changed=true}
  if(changed&&!typing())render(1);
}
async function syncNow(manual){
  if(!sb||!sess)return;if(syncBusy){syncAgain=true;return}
  syncBusy=true;syncMsg='';paintSync();
  try{
    const{data,error}=await sb.from('reps_state').select('data').eq('user_id',sess.user.id).maybeSingle();if(error)throw error;
    const remote=data?.data||null;
    if(remote){const m=norm(mergeState(S,remote));
      if(canon(m)!==canon(S)){if(typing()){syncAgain=true}else{S=m;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render(1)}}}
    if(!remote||canon(S)!==canon(remote)){const{error:e2}=await sb.from('reps_state').upsert({user_id:sess.user.id,data:S,updated_at:new Date().toISOString()});if(e2)throw e2}
    await syncBlobs();syncAt=Date.now();
  }catch(e){syncMsg=navigator.onLine===false?'Uten nett. Synker når du er på nett igjen.':'Synk feilet: '+(e?.message||'ukjent feil')}
  syncBusy=false;paintSync();if(manual)toast(syncMsg||'Synket');
  if(syncAgain){syncAgain=false;queueSync()}
}
function sbStart(){
  if(!SB_URL||!SB_KEY)return;
  const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
  sc.onload=()=>{try{sb=window.supabase.createClient(SB_URL,SB_KEY);
    sb.auth.onAuthStateChange((ev,s)=>{const was=sess?.user?.id;sess=s;
      if(s&&s.user.id!==was)setTimeout(()=>{render(1);syncNow()},0);
      if(!s&&was)setTimeout(()=>render(1),0)});
    render(1);
    fetch(SB_URL+'/auth/v1/settings',{headers:{apikey:SB_KEY}}).then(r=>r.json()).then(d=>{hasGoogle=!!d?.external?.google}).catch(()=>{})}catch(e){sb=null}};
  document.head.append(sc);
}

function finish(auto){
  const left=T.run?Math.max(0,(T.end-Date.now())/1000):T.left;
  const mins=Math.max(1,Math.round((T.mins*60-left)/60));
  const log={};for(const it of S.plan.items){const l=T.log[it.n];if(!l)continue;const r=Math.round(num(l.r)),kg=r1(num(l.kg));if(r>0||kg>0){log[it.n]={r,kg};S.exlog[it.n]={r,kg,d:today()}}}
  const d=day(today(),true);d.workout={mins,rounds:T.rounds,items:S.plan.items.map(i=>i.n),log};d.done.move=true;save();
  T.on=false;T.run=false;if(wake){wake.release().catch(()=>{});wake=null}
  if(auto)beep();
  tab='today';viewDate=today();render();toast(`Økt logget: ${mins} min 💪`);
}

function portions(){
  const t=S.targets,kc=Math.round((t.kcalMin+t.kcalMax)/2*.3),pr=Math.round(t.protein/3);
  const P=food('p'),C=food('c'),V=food('v'),vg=150,r10=x=>Math.round(x/10)*10,cl=(x,a,b)=>Math.min(b,Math.max(a,x));
  let pg=0,cg=0;
  for(let i=0;i<3;i++){
    pg=cl(r10((pr-V[2]*vg/100-C[2]*cg/100)/P[2]*100),80,P[3]||300);
    cg=cl(r10((kc-P[1]*pg/100-V[1]*vg/100)/C[1]*100),C[4]||50,C[3]||350)}
  const g={p:pg,c:cg,v:vg},row=(f,x)=>[Math.round(f[1]*x/100),Math.round(f[2]*x/100)];
  const rs=[row(P,pg),row(C,cg),row(V,vg)];

function onInput(e){
  const el=e.target;
  if(el.dataset.i&&I[el.dataset.i])return I[el.dataset.i](el,e.type);
  if(el.dataset.g){S.goals[el.dataset.g]=el.value;save();syncDecl()}
  if(el.dataset.p){S.profile[el.dataset.p]=['sex','goal'].includes(el.dataset.p)?el.value:num(el.value);save();syncCalc()}
  if(el.id==='impfile'&&e.type==='change'&&el.files[0])restoreFile(el.files[0]);
  if(el.id==='memofile'&&e.type==='change'&&el.files[0]){idbSet('memo',el.files[0]).then(()=>{S.goals.memo=true;S.goals.memoU=Date.now();holdBlob('memo',S.goals.memoU);save();render(1);toast('Opptak lagret')}).catch(()=>toast('Kunne ikke lagre opptaket'))}
}
document.addEventListener('input',onInput);document.addEventListener('change',onInput);
render();sbStart();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()});
addEventListener('online',()=>syncNow());
navigator.storage?.persist?.().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
